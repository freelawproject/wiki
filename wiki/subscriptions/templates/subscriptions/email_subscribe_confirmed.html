{% extends "base.html" %}

{% block title %}Subscribed - FLP Wiki{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="card text-center">
    <h1 class="text-2xl mb-4">You're Subscribed</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-6">
      You'll get an email whenever <strong>"{{ page.title }}"</strong>
      changes. Every message includes an unsubscribe link.
    </p>
    <a href="{{ page.get_absolute_url }}" class="btn-outline text-sm">Back to Page</a>
  </div>
</div>
{% endblock %}
